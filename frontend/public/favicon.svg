<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Krishna Medicose">
  <defs>
    <linearGradient id="kmTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="kmCross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#99F6E4"/>
